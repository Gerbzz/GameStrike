    <linearGradient id="back" x1="45" y1="45" x2="196" y2="189" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72E2EF"/>
      <stop offset="1" stop-color="#4CA9EF"/>
    </linearGradient>
    <linearGradient id="front" x1="63" y1="70" x2="203" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#627FEF"/>
      <stop offset=".58" stop-color="#4B63C3"/>
