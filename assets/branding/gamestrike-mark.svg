  <rect x="106" y="106" width="19" height="59" rx="9.5" fill="#9CEEF2"/>
  <circle cx="174" cy="114" r="12" fill="url(#buttons)"/>
  <circle cx="160" cy="147" r="12" fill="url(#buttons)"/>
