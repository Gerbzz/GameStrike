name: Windows source checks

on:
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Launcher input regression
        run: node --test ui/app.test.cjs
      - name: Source tests
        run: cargo test --locked --features launcher-windows --lib --bin gamestrike-launcher --bin gamestrike-player -j 2
      - name: Build launcher and player
        run: cargo build --locked --features launcher-windows --bin gamestrike-launcher --bin gamestrike-player -j 2
      - name: Preserve test binaries
        uses: actions/upload-artifact@v4
        with:
          name: gamestrike-windows-debug
          path: |
            target/debug/gamestrike-launcher.exe
            target/debug/gamestrike-player.exe
          if-no-files-found: error
          retention-days: 1
