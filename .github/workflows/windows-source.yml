name: Windows source checks

on:
  pull_request:

jobs:
  launcher:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: Launcher input regression
        run: node --test ui/app.test.cjs
      - name: Source tests
        run: cargo test --locked --features launcher-windows --lib --bin gamestrike-launcher --bin gamestrike-player -j 2
      - name: Build launcher and player
        run: cargo build --locked --features launcher-windows --bin gamestrike-launcher --bin gamestrike-player -j 2
      - name: Build fixture importer
        run: cargo build --locked --bin gamestrike -j 2
      - name: Capture hosted launcher
        shell: pwsh
        run: ./scripts/hosted-library-capture.ps1
      - name: Upload launcher PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamestrike-library-visual
          path: ${{ runner.temp }}/gamestrike-library-visual/*.png
          if-no-files-found: ignore
          retention-days: 1
